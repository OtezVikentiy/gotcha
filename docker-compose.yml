services:
  gotcha:
    # Ротация логов. Без неё json-file растёт без границы, а продукт умеет
    # шуметь: проба при недоступном центре пишет ошибку каждую секунду,
    # приём — предупреждение на каждый отклонённый по лимиту запрос. На
    # документированном минимуме в 20 ГБ это забивает диск ХОСТА, унося с
    # собой и базы.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      # Метаданные версии для ldflags. Значения приходят из окружения (их
      # проставляет `make build`/`up-rebuild` из git); при прямом
      # `docker compose build` без них образ честно помечается версией "dev".
      args:
        VERSION: ${GOTCHA_VERSION:-dev}
        COMMIT: ${GOTCHA_COMMIT:-}
        DATE: ${GOTCHA_DATE:-}
    restart: unless-stopped
    # Потолок памяти приложения. Нужен не ради экономии, а ради того, чтобы
    # потолок вообще СУЩЕСТВОВАЛ: при недоступном ClickHouse буферы растут по
    # замыслу — они копят телеметрию, пока хранилище вернётся, — и без лимита
    # первым срабатывает OOM-killer ядра. Тогда теряются все пять буферов
    # целиком, вместо того чтобы аккуратно отбрасывать избыток по своим потолкам.
    #
    # Сам GOMEMLIMIT здесь не задаётся: приложение читает этот лимит из cgroup и
    # выставляет потолок кучи само (80% лимита). Явный GOMEMLIMIT в окружении
    # по-прежнему главнее — см. docker-compose.small.yml.
    #
    # 1 ГБ — для рекомендованной конфигурации (4 ГБ RAM), где основную часть
    # памяти забирает ClickHouse. На сервере с запасом поднимается переменной,
    # без правки этого файла: GOTCHA_MEM_LIMIT=2g docker compose up -d
    mem_limit: ${GOTCHA_MEM_LIMIT:-1g}
    # Бюджет дренажа при остановке. Дефолт Docker — 10 секунд, а корректное
    # завершение занимает дольше: HTTP-сервер (10с) + пять писателей телеметрии
    # по 10с + очередь пайплайна. С дефолтом SIGKILL прилетал на 10-й секунде на
    # ШТАТНОМ пути деплоя (docker compose up -d), и содержимое буферов —
    # события, спаны, метрики, профили, результаты проверок — терялось целиком.
    stop_grace_period: 90s
    ports:
      # Внешний порт вынесен в 59xxx, чтобы не конфликтовать с другими
      # локальными докер-проектами. Переопределяется: GOTCHA_PORT=... docker compose up
      - "${GOTCHA_PORT:-59080}:8080"
    # Признак готовности. Без него зависший процесс числился Up бесконечно:
    # restart-политика перезапускает только упавший. Смотрит на /readyz —
    # «готов ли работать»: /healthz отвечает 200, пока жив сам процесс, и на
    # проблемы с хранилищем не реагирует намеренно.
    #
    # start_period покрывает первый старт с миграциями (до минуты).
    #
    # Честно про пределы: сам docker compose из-за проваленной проверки
    # контейнер НЕ перезапускает — только меняет метку в `docker ps` (реакция
    # на unhealthy есть у Swarm/Kubernetes). restart-политика ловит только
    # упавший процесс. Как вынести состояние наружу — см. документацию
    # /docs/self-monitoring.
    healthcheck:
      test: ["CMD", "gotcha", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    # Приложению не нужен ни один capability и не нужна запись в свою
    # файловую систему: логи в stderr, состояние в базах, томов у сервиса
    # нет. Каждая строка ниже отнимает у эксплуатации чужого кода в этом
    # контейнере по инструменту: поднять привилегии, записать файл,
    # расплодить процессы. tmpfs /tmp — стандартный служебный каталог;
    # сам gotcha в него не пишет, но его может ждать рантайм.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 512
    # Всё остальное — из .env рядом с этим файлом. Без env_file Compose читает
    # .env ТОЛЬКО для подстановки ${...} в сам YAML и в контейнер не передаёт
    # ничего: оператор клал туда SMTP, ретенцию, GOTCHA_REGISTRATION — и ни одна
    # из этих настроек не применялась, причём Compose даже не пересоздавал
    # контейнер, потому что итоговая конфигурация не менялась.
    #
    # required: false — файла может не быть (быстрый старт без настройки).
    env_file:
      - path: .env
        required: false
    # Значения ниже заданы явно и ПЕРЕКРЫВАЮТ .env: DSN указывают на соседние
    # сервисы этого же compose-файла, и подменять их через .env нечего.
    environment:
      # Пароли баз здесь и в сервисах ниже приходят из одной пары переменных
      # (GOTCHA_PG_PASSWORD/GOTCHA_CH_PASSWORD), три оговорки:
      # 1. POSTGRES_PASSWORD/CLICKHOUSE_PASSWORD действуют только при
      #    ИНИЦИАЛИЗАЦИИ тома — на существующей установке сменить пароль
      #    переменной нельзя: сначала ALTER USER gotcha WITH PASSWORD '…' (PG) /
      #    ALTER USER gotcha IDENTIFIED BY '…' (CH), и только потом менять
      #    переменную. Порядок расписан в /docs/configuration.
      # 2. Пароль подставляется в DSN-URL как есть — символы, требующие
      #    URL-экранирования (@ / : # %), не использовать.
      # 3. Дефолт «gotcha» — только для локального квикстарта.
      GOTCHA_PG_DSN: postgres://gotcha:${GOTCHA_PG_PASSWORD:-gotcha}@postgres:5432/gotcha?sslmode=disable
      GOTCHA_CH_DSN: clickhouse://gotcha:${GOTCHA_CH_PASSWORD:-gotcha}@clickhouse:9000/gotcha
      # BaseURL обязан совпадать с внешним портом: из него строятся DSN проекта,
      # ссылки на issue в алертах и ссылки-приглашения.
      GOTCHA_BASE_URL: ${GOTCHA_BASE_URL:-http://localhost:59080}
      # Local quickstart secret only — MUST be overridden for any real deployment.
      GOTCHA_SECRET_KEY: ${GOTCHA_SECRET_KEY:-insecure-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  postgres:
    # Ротация логов. Без неё json-file растёт без границы, а продукт умеет
    # шуметь: проба при недоступном центре пишет ошибку каждую секунду,
    # приём — предупреждение на каждый отклонённый по лимиту запрос. На
    # документированном минимуме в 20 ГБ это забивает диск ХОСТА, унося с
    # собой и базы.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Политика рестарта ОБЯЗАТЕЛЬНА и для баз, не только для gotcha: без неё
    # после перезагрузки хоста или рестарта docker-демона Docker поднимет
    # только сервисы со своей политикой. База осталась бы лежать, gotcha
    # (fail-fast на подключении) ушёл бы в вечный крэшлуп — и система
    # мониторинга оказалась бы молча мертва, причём сообщить об этом
    # оказалось бы некому: она сама и есть тот, кто должен сообщать.
    restart: unless-stopped
    image: postgres:17-alpine
    # Потолок памяти — чтобы он вообще СУЩЕСТВОВАЛ (как у gotcha выше): без
    # него ночной OOM-killer ядра сам выбирает жертву по всему хосту. На
    # сервере с запасом поднимается переменной, без правки файла.
    mem_limit: ${GOTCHA_PG_MEM_LIMIT:-512m}
    # Здесь только УНИВЕРСАЛЬНЫЕ настройки — верные на любом железе.
    # Обе описывают носитель, а не размер сервера: дефолты PostgreSQL
    # рассчитаны на диски со шпинделем, а Gotcha требует SSD (см. документацию).
    # Всё, что пропорционально ресурсам (shared_buffers, effective_cache_size,
    # число воркеров), сознательно НЕ трогаем: на большом сервере такие потолки
    # сделают только хуже. Для стеснённых машин есть docker-compose.small.yml.
    command:
      - postgres
      - -c
      - random_page_cost=1.1                # SSD (дефолт 4 — это про «блины»)
      - -c
      - effective_io_concurrency=200        # SSD (дефолт 1)
    environment:
      POSTGRES_USER: gotcha
      # Действует только при инициализации тома; смена пароля на живой
      # установке — через ALTER USER, см. комментарий у сервиса gotcha.
      POSTGRES_PASSWORD: ${GOTCHA_PG_PASSWORD:-gotcha}
      POSTGRES_DB: gotcha
    # start_period: без него бюджет проверок (60 с здесь, 120 с у ClickHouse)
    # тратится на инициализацию, и на минимальном VPS первый запуск падает
    # «dependency failed to start», хотя через десять секунд база была бы
    # готова.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotcha -d gotcha"]
      interval: 2s
      timeout: 2s
      start_period: 60s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  clickhouse:
    # Ротация логов. Без неё json-file растёт без границы, а продукт умеет
    # шуметь: проба при недоступном центре пишет ошибку каждую секунду,
    # приём — предупреждение на каждый отклонённый по лимиту запрос. На
    # документированном минимуме в 20 ГБ это забивает диск ХОСТА, унося с
    # собой и базы.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Политика рестарта ОБЯЗАТЕЛЬНА и для баз, не только для gotcha: без неё
    # после перезагрузки хоста или рестарта docker-демона Docker поднимет
    # только сервисы со своей политикой. База осталась бы лежать, gotcha
    # (fail-fast на подключении) ушёл бы в вечный крэшлуп — и система
    # мониторинга оказалась бы молча мертва, причём сообщить об этом
    # оказалось бы некому: она сама и есть тот, кто должен сообщать.
    restart: unless-stopped
    image: clickhouse/clickhouse-server:25.3-alpine
    # Потолок памяти ОБЯЗАТЕЛЕН именно у ClickHouse: без cgroup-лимита он
    # берёт max_server_memory_usage_to_ram_ratio=0.9 от памяти ХОСТА — на
    # рекомендованных 4 ГБ это 3.6 ГБ поверх гигабайта приложения, ночью
    # OOM-killer выбирает самый жирный процесс, и это ClickHouse. CPU при
    # этом сознательно не ограничиваем: на сервере с запасом лимит только
    # вредит (замедлит merge и запросы, ничего не защитив); стеснённые
    # машины берут docker-compose.small.yml.
    mem_limit: ${GOTCHA_CH_MEM_LIMIT:-2g}
    environment:
      CLICKHOUSE_DB: gotcha
      CLICKHOUSE_USER: gotcha
      # Действует только при инициализации тома; смена пароля на живой
      # установке — через ALTER USER, см. комментарий у сервиса gotcha.
      CLICKHOUSE_PASSWORD: ${GOTCHA_CH_PASSWORD:-gotcha}
    healthcheck:
      # 127.0.0.1, а не localhost: внутри контейнера localhost резолвится в ::1,
      # а сервер ClickHouse слушает только IPv4 — healthcheck зависал бы навсегда.
      #
      # start_period — тот же расчёт, что у postgres: первый старт ClickHouse
      # на минимальном VPS занимает десятки секунд.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 2s
      timeout: 2s
      start_period: 60s
      retries: 60
    volumes:
      - chdata:/var/lib/clickhouse
      # Универсальные настройки: TTL на системные логи. По умолчанию у trace_log,
      # text_log и asynchronous_metric_log его нет, и они растут бесконечно —
      # это вредно на любом железе. Сами логи оставлены: это диагностика.
      # Настройки под слабое железо — в docker-compose.small.yml.
      - ./deploy/clickhouse/00-common.xml:/etc/clickhouse-server/config.d/00-common.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

networks:
  default:
    driver_opts:
      # MTU сети контейнеров. Docker по умолчанию берёт 1500 и не смотрит на
      # аплинк хоста, а у VPS за туннелем (GRE/VXLAN/OpenVZ) он сплошь и рядом
      # 1450. Тогда контейнер анонсирует MSS 1460, сервер отвечает сегментами,
      # которые в тракт не пролезают, и они пропадают молча: мелкие пакеты
      # ходят, а первый крупный обмен — цепочка сертификатов в TLS — теряется
      # целиком. Наружу это выглядит как таймаут на живом соединении: TCP
      # установлен, приветствие SMTP получено, дальше тишина. Тем же путём
      # ходят вебхуки, OAuth и HTTP-проверки аптайма, поэтому чужой сайт может
      # числиться недоступным из-за MTU своего же контейнера.
      #
      # Смотрится так: `ip -o link show` на хосте. Если MTU внешнего
      # интерфейса меньше 1500 — поставить сюда его значение и поднять стек
      # заново: GOTCHA_NET_MTU=1450 docker compose down && docker compose up -d.
      # Именно down, а не один up: смена опции требует пересоздания сети, и
      # если делать это под работающими контейнерами, встроенный DNS Docker
      # остаётся с прежними записями — сервисы перестают видеть друг друга по
      # имени («lookup postgres on 127.0.0.11:53: server misbehaving»), пока
      # стек не поднимут целиком.
      com.docker.network.driver.mtu: "${GOTCHA_NET_MTU:-1500}"

volumes:
  pgdata:
  chdata:
