services:
  gotcha:
    # Ротация логов: без неё json-file растёт без предела и забивает диск хоста
    # (продукт шумит при недоступном хранилище). Детали — /docs/self-monitoring.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      # Метаданные версии для ldflags из окружения (проставляет make build/up-rebuild);
      # при прямом `docker compose build` образ помечается версией "dev".
      args:
        VERSION: ${GOTCHA_BUILD_VERSION:-dev}
        COMMIT: ${GOTCHA_BUILD_COMMIT:-}
        DATE: ${GOTCHA_BUILD_DATE:-}
    restart: unless-stopped
    # Потолок памяти нужен, чтобы он вообще существовал: при недоступном ClickHouse
    # буферы растут по замыслу, и без лимита раньше срабатывает OOM-killer ядра.
    # GOMEMLIMIT приложение берёт из cgroup само (80%). Поднимается: GOTCHA_COMPOSE_MEM_LIMIT=2g.
    mem_limit: ${GOTCHA_COMPOSE_MEM_LIMIT:-1g}
    # Бюджет дренажа при остановке: дефолт Docker (10с) режет корректное завершение
    # (HTTP + 5 писателей телеметрии), теряя буферы. 90с хватает штатному пути.
    stop_grace_period: 90s
    ports:
      # Внешний порт в 59xxx, чтобы не конфликтовать с другими докер-проектами.
      # Переопределяется: GOTCHA_COMPOSE_PORT=... docker compose up.
      #
      # Бинд по умолчанию — ТОЛЬКО loopback (GOTCHA_COMPOSE_BIND=127.0.0.1).
      # Раньше публиковалось на 0.0.0.0 безусловно: чек-лист прод-развёртывания
      # (installation.md) ставит перед приложением TLS-реверс-прокси
      # (nginx/Caddy), но голый HTTP-вход и открытый /metrics (self-телеметрия
      # без аутентификации) оставались доступны напрямую по 59080 В ОБХОД
      # прокси с ЛЮБОГО адреса — TLS-чек-лист не давал заявленной защиты.
      # 127.0.0.1 не ломает документированный сценарий: nginx/Caddy на том же
      # хосте достают до приложения по loopback ровно как раньше
      # (`proxy_pass http://127.0.0.1:59080`), а прямой внешний доступ
      # закрывается по умолчанию. Квикстарту БЕЗ реверс-прокси (чек-лист
      # installation.md отдельно описывает раннюю стадию — открыть
      # http://<server-IP>:59080 до настройки HTTPS) нужен внешний бинд явно:
      # GOTCHA_COMPOSE_BIND=0.0.0.0 в .env.
      - "${GOTCHA_COMPOSE_BIND:-127.0.0.1}:${GOTCHA_COMPOSE_PORT:-59080}:8080"
    # Признак готовности (/readyz): без него зависший процесс числился Up бесконечно.
    # start_period покрывает первый старт с миграциями. Важно: сам compose unhealthy-
    # контейнер не перезапускает (лишь метка в ps) — см. /docs/self-monitoring.
    healthcheck:
      test: ["CMD", "gotcha", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    # Приложению не нужны capabilities и запись в свою ФС (логи в stderr, состояние
    # в базах). Ужимаем поверхность для чужого кода. tmpfs /tmp — на случай рантайма.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # Именованный том, а не bind/tmpfs: файлы выгрузок переживают пересоздание
    # контейнера (TTL по умолчанию семь суток). Подробнее — /docs/exports.
    volumes:
      - exportdata:/var/lib/gotcha/exports
    pids_limit: 512
    # Остальное — из .env рядом с файлом. Без env_file Compose читает .env только для
    # подстановки ${...} в YAML, в контейнер не передавая (SMTP/ретенция не применялись).
    # required: false — файла может не быть (быстрый старт).
    env_file:
      - path: .env
        required: false
    # Значения ниже заданы явно и ПЕРЕКРЫВАЮТ .env: DSN указывают на соседние
    # сервисы этого же compose-файла, и подменять их через .env нечего.
    environment:
      # Пароли баз — из GOTCHA_COMPOSE_PG_PASSWORD/GOTCHA_COMPOSE_CH_PASSWORD;
      # дефолт «gotcha» годится только для квикстарта. Смена, ограничения
      # символов — /docs/configuration.
      GOTCHA_PG_DSN: postgres://gotcha:${GOTCHA_COMPOSE_PG_PASSWORD:-gotcha}@postgres:5432/gotcha?sslmode=disable
      GOTCHA_CH_DSN: clickhouse://gotcha:${GOTCHA_COMPOSE_CH_PASSWORD:-gotcha}@clickhouse:9000/gotcha
      # BaseURL обязан совпадать с внешним портом: из него строятся DSN проекта,
      # ссылки на issue в алертах и ссылки-приглашения.
      GOTCHA_BASE_URL: ${GOTCHA_BASE_URL:-http://localhost:59080}
      # Local quickstart secret only — MUST be overridden for any real deployment.
      GOTCHA_SECRET_KEY: ${GOTCHA_SECRET_KEY:-insecure-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  postgres:
    # Ротация логов: без неё json-file растёт без предела и забивает диск хоста
    # (продукт шумит при недоступном хранилище). Детали — /docs/self-monitoring.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Политика рестарта обязательна и для баз: иначе после перезагрузки хоста Docker
    # поднимет только сервисы со своей политикой — база ляжет, а gotcha (fail-fast)
    # уйдёт в крэшлуп, и мониторинг молча мёртв.
    restart: unless-stopped
    # Образ закреплён digest'ом (та же политика, что и в Dockerfile для
    # golang/alpine): тег сам по себе может уехать под нами при `docker compose
    # pull`, а это единственный носитель состояния всей инсталляции. Тег
    # оставлен для читаемости, @sha256 — авторитетен. Обновление:
    #   docker buildx imagetools inspect postgres:17-alpine   (copy the Digest)
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    # Бюджет дренажа: постгрес держит только метаданные (проекты, пользователи,
    # правила алертов, SLO — сырые события уходят в ClickHouse), поэтому объём
    # грязных страниц с последнего чекпойнта мал и штатный fast-shutdown
    # чекпойнт укладывается в секунды. 30с — многократный запас над дефолтом
    # Docker (10с), который прошлый аудит отметил как риск SIGKILL посреди
    # чекпойнта.
    stop_grace_period: 30s
    # Потолок памяти — чтобы он существовал (как у gotcha): иначе OOM-killer ядра
    # выбирает жертву по всему хосту. Поднимается переменной.
    mem_limit: ${GOTCHA_COMPOSE_PG_MEM_LIMIT:-512m}
    # Только УНИВЕРСАЛЬНЫЕ настройки носителя (Gotcha требует SSD; дефолты PG — под
    # шпиндель). Пропорциональное ресурсам (shared_buffers и пр.) не трогаем — на
    # большом сервере навредит. Слабое железо — docker-compose.small.yml.
    command:
      - postgres
      - -c
      - random_page_cost=1.1                # SSD (дефолт 4 — это про «блины»)
      - -c
      - effective_io_concurrency=200        # SSD (дефолт 1)
    environment:
      POSTGRES_USER: gotcha
      # Действует только при инициализации тома; смена — через ALTER USER (см. gotcha).
      POSTGRES_PASSWORD: ${GOTCHA_COMPOSE_PG_PASSWORD:-gotcha}
      POSTGRES_DB: gotcha
    # start_period: иначе бюджет проверок тратится на инициализацию и первый запуск
    # на минимальном VPS падает «dependency failed to start».
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotcha -d gotcha"]
      interval: 2s
      timeout: 2s
      start_period: 60s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  clickhouse:
    # Ротация логов: без неё json-file растёт без предела и забивает диск хоста
    # (продукт шумит при недоступном хранилище). Детали — /docs/self-monitoring.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Политика рестарта обязательна и для баз: иначе после перезагрузки хоста Docker
    # поднимет только сервисы со своей политикой — база ляжет, а gotcha (fail-fast)
    # уйдёт в крэшлуп, и мониторинг молча мёртв.
    restart: unless-stopped
    # Образ закреплён digest'ом — та же политика, что и у postgres выше и у
    # golang/alpine в Dockerfile. Обновление:
    #   docker buildx imagetools inspect clickhouse/clickhouse-server:25.3-alpine   (copy the Digest)
    image: clickhouse/clickhouse-server:25.3-alpine@sha256:a4e8cf46e526a06f4f52d22f7fa8d07472b55d3c896d7ca3f159e249be38ae62
    # Бюджет дренажа: в отличие от постгреса выше, ClickHouse — основной приёмник
    # телеметрии (7 таблиц событий/логов/метрик/трейсов под TTL, шесть писателей
    # приложения льют сюда напрямую), и фоновые мержи MergeTree под таким
    # объёмом крупнее и дольше, чем чекпойнт метаданных в PG. Прерванный мерж
    # не теряет данные (атомарная замена частей, недомерженное просто
    # переделывается после рестарта), но SIGKILL до его завершения — лишняя
    # работа на следующем старте. 60с — тот же порядок, что уже заложен в
    # start_period healthcheck'а ниже для медленного холодного старта ClickHouse,
    # и с запасом ниже собственного 90с-бюджета gotcha, так что к моменту SIGTERM
    # сюда (compose останавливает сервисы в обратном порядке зависимостей)
    # писатели приложения уже штатно дренированы.
    stop_grace_period: 60s
    # Потолок памяти обязателен: без cgroup-лимита ClickHouse берёт 0.9 памяти ХОСТА
    # (3.6 ГБ на рекомендованных 4) и становится жертвой OOM. CPU не ограничиваем —
    # лимит только вредит merge/запросам. Слабое железо — docker-compose.small.yml.
    mem_limit: ${GOTCHA_COMPOSE_CH_MEM_LIMIT:-2g}
    environment:
      CLICKHOUSE_DB: gotcha
      CLICKHOUSE_USER: gotcha
      # Действует только при инициализации тома; смена — через ALTER USER (см. gotcha).
      CLICKHOUSE_PASSWORD: ${GOTCHA_COMPOSE_CH_PASSWORD:-gotcha}
    healthcheck:
      # 127.0.0.1, не localhost: внутри контейнера localhost = ::1, а ClickHouse слушает
      # только IPv4 (иначе healthcheck зависает). start_period — как у postgres.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 2s
      timeout: 2s
      start_period: 60s
      retries: 60
    volumes:
      - chdata:/var/lib/clickhouse
      # Универсальная настройка: TTL на системные логи (trace_log/text_log/…), иначе
      # растут бесконечно. Сами логи оставлены (диагностика). Слабое железо — *.small.yml.
      - ./deploy/clickhouse/00-common.xml:/etc/clickhouse-server/config.d/00-common.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

networks:
  default:
    driver_opts:
      # MTU сети контейнеров: Docker берёт 1500, не глядя на аплинк хоста. Трогать
      # только по симптому — /docs/configuration разбирает, по какому именно.
      com.docker.network.driver.mtu: "${GOTCHA_COMPOSE_NET_MTU:-1500}"

volumes:
  pgdata:
  chdata:
  exportdata:
