# CI для gotcha.
#
# Разбито на две работы намеренно: `quick` не требует docker и отвечает за минуту —
# то, что должно гореть красным на каждый push. `integration` поднимает postgres и
# clickhouse через testcontainers и включает детектор гонок на тестах с БД.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: fmt + vet + unit + race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "не отформатировано (запустите make fmt):"
            echo "$unformatted"
            exit 1
          fi

      # Версия и sha256 пинуются тем же принципом, что и digest базы Dockerfile.
      - name: shellcheck install.sh
        run: |
          SC_VER=v0.10.0
          SC_SHA256=6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
          curl -fsSL -o sc.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${SC_VER}/shellcheck-${SC_VER}.linux.x86_64.tar.xz"
          echo "${SC_SHA256}  sc.tar.xz" | sha256sum -c -
          tar -xJf sc.tar.xz
          "./shellcheck-${SC_VER}/shellcheck" internal/web/install.sh internal/docs/install-bare-metal.sh scripts/bare-metal-e2e.sh

      - name: install-bare-metal.sh unit tests
        run: bash scripts/test-install-bare-metal.sh

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # Клиентский JS без node_modules и без сборки: node:test гоняет static/*.js
      # как есть через самодельный DOM-шим (internal/web/static/jstest).
      - name: клиентский JS (node --check + node --test)
        run: make test-js

      - name: go vet
        run: go vet ./...

      # Версия пинуется тем же принципом, что и базовые образы (digest):
      # @latest в CI — это неповторяемая сборка. Обновлять руками.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: go mod tidy — нет расхождений
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod/go.sum расходятся с деревом — выполните go mod tidy и закоммитьте:"
            git --no-pager diff go.mod go.sum
            exit 1
          fi

      # vendor/ обязан совпадать с go.mod: docker-сборка идёт с -mod=vendor без сети.
      # go mod verify — целостность содержимого, go mod vendor без диффа — актуальность набора.
      - name: vendor — синхронен с go.mod
        run: |
          go mod verify
          go mod vendor
          if ! git diff --quiet vendor go.mod go.sum; then
            echo "vendor/ расходится с go.mod — выполните go mod vendor и закоммитьте:"
            git --no-pager diff --stat vendor go.mod go.sum
            exit 1
          fi

      # Иначе правка .templ уезжает в main, а рендерится старый *_templ.go —
      # расхождение, которое не ловится ни компилятором, ни тестами.
      - name: templ generate — нет расхождений
        run: |
          go run github.com/a-h/templ/cmd/templ@$(go list -m -f '{{.Version}}' github.com/a-h/templ) generate
          if ! git diff --quiet -- '*_templ.go'; then
            echo "*_templ.go расходится с *.templ — выполните make templ и закоммитьте:"
            git --no-pager diff --stat -- '*_templ.go'
            exit 1
          fi

      - name: unit-тесты
        run: go test ./... -short -count=1 -timeout 900s

      - name: детектор гонок (unit)
        run: go test ./... -short -race -count=1 -timeout 900s

  integration:
    name: интеграционные + покрытие
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Порог покрытия — храповик: снижать нельзя, см. scripts/coverage.sh.
      # Он же прогоняет весь набор с поднятыми контейнерами, поэтому отдельного
      # шага с `go test ./...` не нужно.
      - name: покрытие + пороги
        run: bash scripts/coverage.sh

  image:
    name: docker-образ + compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 — make build вычисляет версию через git describe --tags;
      # с усечённой историей тег не найдётся и образ соберётся «no build
      # metadata» — то есть CI перестал бы проверять ровно тот путь, который
      # документация называет штатным.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: make build — путь оператора
        run: make build

      - name: compose config — оба файла валидны
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.small.yml config -q

      # --wait опирается на healthcheck'и всех трёх сервисов — то есть
      # заодно проверяет их самих (start_period, команду, порт).
      - name: подъём стека
        run: docker compose up -d --wait --wait-timeout 180

      - name: /readyz
        run: curl -fsS http://localhost:59080/readyz

      - name: логи при отказе
        if: failure()
        run: docker compose logs

      - name: снос стека
        if: always()
        run: docker compose down -v

  bare-metal:
    name: bare-metal установка (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: собрать тарбол поставки
        run: bash scripts/build-dist.sh --version 0.0.0 --arch ${{ matrix.arch }} --out dist

      # Раннер несёт предустановленный (не запущенный) postgresql — гасим заранее,
      # иначе preflight откажет по занятому порту 5432.
      - name: погасить предустановленные СУБД раннера
        run: sudo systemctl stop postgresql clickhouse-server 2>/dev/null || true

      - name: install-bare-metal.sh на раннере
        run: sudo -E bash scripts/bare-metal-e2e.sh --tarball "dist/gotcha-0.0.0-linux-${{ matrix.arch }}.tar.gz"

      - name: логи сервисов при отказе
        if: failure()
        run: |
          sudo journalctl -u gotcha -u postgresql -u clickhouse-server --no-pager -n 200 || true

  race-integration:
    name: гонки на интеграционных
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Отдельной работой и только на main: прогон долгий, а ценность — в том,
    # чтобы гонка в конкурентных путях с БД не доехала до релиза.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race (интеграционные)
        run: go test ./... -race -count=1 -p 1 -timeout 2400s
