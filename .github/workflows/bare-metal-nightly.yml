# Дистрибутивы без своего GitHub-раннера (задача 4 гоняет Ubuntu 24.04 на PR):
# systemd в образе отсутствует, поднимаем его разовым слоем и уже внутри — /sbin/init.
name: bare-metal ночной прогон

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: bare-metal-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: bare-metal установка (${{ matrix.image }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      # covers — единственное место, где живёт решение «покрывает ещё и RHEL»;
      # internal/guards/bare_metal_docs_test.go сверяет его с allowlist и докой.
      matrix:
        include:
          - { image: almalinux:9,              arch: amd64, runner: ubuntu-24.04,     covers: "AlmaLinux 9, RHEL 9" }
          - { image: almalinux:9,              arch: arm64, runner: ubuntu-24.04-arm, covers: "AlmaLinux 9, RHEL 9" }
          - { image: almalinux:10,             arch: amd64, runner: ubuntu-24.04,     covers: "AlmaLinux 10, RHEL 10" }
          - { image: almalinux:10,             arch: arm64, runner: ubuntu-24.04-arm, covers: "AlmaLinux 10, RHEL 10" }
          - { image: rockylinux/rockylinux:9,  arch: amd64, runner: ubuntu-24.04,     covers: "Rocky Linux 9" }
          - { image: rockylinux/rockylinux:9,  arch: arm64, runner: ubuntu-24.04-arm, covers: "Rocky Linux 9" }
          - { image: rockylinux/rockylinux:10, arch: amd64, runner: ubuntu-24.04,     covers: "Rocky Linux 10" }
          - { image: rockylinux/rockylinux:10, arch: arm64, runner: ubuntu-24.04-arm, covers: "Rocky Linux 10" }
          - { image: "debian:12",              arch: amd64, runner: ubuntu-24.04,     covers: "Debian 12" }
          - { image: "debian:13",              arch: amd64, runner: ubuntu-24.04,     covers: "Debian 13" }
          - { image: "ubuntu:24.04",           arch: amd64, runner: ubuntu-24.04,     covers: "Ubuntu 24.04" }
          - { image: "ubuntu:26.04",           arch: amd64, runner: ubuntu-24.04,     covers: "Ubuntu 26.04" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Две версии: --upgrade-from проверяет апгрейд поверх уже установленной
      # старой версии, а не только свежую установку.
      - name: собрать тарболы поставки (старая + новая версия)
        run: |
          bash scripts/build-dist.sh --version 0.0.0 --arch ${{ matrix.arch }} --out dist
          bash scripts/build-dist.sh --version 0.0.1 --arch ${{ matrix.arch }} --out dist

      # Выбор Dockerfile — по matrix.image. Образы *-minimal не используем:
      # в них microdnf вместо dnf.
      - name: собрать образ с systemd поверх ${{ matrix.image }}
        run: |
          case "${{ matrix.image }}" in
            debian:*|ubuntu:*)
          cat >Dockerfile.bare-metal-systemd <<EOF
          FROM ${{ matrix.image }}
          RUN apt-get update && apt-get install -y systemd systemd-sysv dbus curl gpg iproute2 procps \
              && apt-get clean
          EOF
              ;;
            *)
          cat >Dockerfile.bare-metal-systemd <<EOF
          FROM ${{ matrix.image }}
          # curl-minimal уже даёт /usr/bin/curl и конфликтует с полным curl.
          # util-linux даёт runuser (sudo больше не нужен): на EL9-минимале он и так
          # стоит транзитивно, а на EL10 по умолчанию только util-linux-core без него.
          RUN dnf -y install systemd procps-ng iproute util-linux gnupg2 openssl which \
              && dnf clean all
          EOF
              ;;
          esac
          docker build -t bare-metal-systemd -f Dockerfile.bare-metal-systemd .

      - name: запустить контейнер с /sbin/init
        run: |
          docker run -d --name bm --privileged --cgroupns=host \
            -v "$PWD/dist:/dist:ro" \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD/internal/docs:/internal/docs:ro" \
            bare-metal-systemd /sbin/init

      - name: дождаться готовности systemd в контейнере
        run: |
          # Сразу после старта контейнера шина ещё не поднята, поэтому
          # `is-system-running --wait` может упасть мгновенно вместо ожидания — опрашиваем сами.
          deadline=$((SECONDS + 60))
          state=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            state=$(docker exec bm systemctl is-system-running 2>/dev/null || true)
            case "$state" in
              running | degraded) break ;;
            esac
            sleep 1
          done
          case "$state" in
            running | degraded) ;;
            *)
              echo "::error::systemd в контейнере не поднялся за 60с (последнее состояние: '$state')"
              exit 1
              ;;
          esac

      - name: install-bare-metal.sh в контейнере (${{ matrix.image }})
        run: |
          docker exec bm bash -lc \
            'CI=true bash /scripts/bare-metal-e2e.sh --tarball /dist/gotcha-0.0.1-linux-${{ matrix.arch }}.tar.gz --upgrade-from /dist/gotcha-0.0.0-linux-${{ matrix.arch }}.tar.gz'

      - name: логи сервисов при отказе
        if: failure()
        run: docker exec bm journalctl -u gotcha -u postgresql -u clickhouse-server --no-pager -n 200 || true

      - name: снять контейнер
        if: always()
        run: docker rm -f bm || true

  runner-matrix:
    # §2 спеки заявляет arm64 для Ubuntu 24.04 и по тегу, и в ночном прогоне;
    # ci.yml/bare-metal триггерится только на PR и его не покрывает.
    name: bare-metal установка на раннере (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: amd64, covers: "Ubuntu 24.04" }
          - { runner: ubuntu-24.04-arm, arch: arm64, covers: "Ubuntu 24.04" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: собрать тарболы поставки (старая + новая версия)
        run: |
          bash scripts/build-dist.sh --version 0.0.0 --arch ${{ matrix.arch }} --out dist
          bash scripts/build-dist.sh --version 0.0.1 --arch ${{ matrix.arch }} --out dist

      # Раннер несёт предустановленный (не запущенный) postgresql — гасим заранее,
      # иначе preflight откажет по занятому порту 5432.
      - name: погасить предустановленные СУБД раннера
        run: sudo systemctl stop postgresql clickhouse-server 2>/dev/null || true

      - name: install-bare-metal.sh на раннере
        run: |
          sudo -E bash scripts/bare-metal-e2e.sh \
            --tarball "dist/gotcha-0.0.1-linux-${{ matrix.arch }}.tar.gz" \
            --upgrade-from "dist/gotcha-0.0.0-linux-${{ matrix.arch }}.tar.gz"

      - name: логи сервисов при отказе
        if: failure()
        run: |
          sudo journalctl -u gotcha -u postgresql -u clickhouse-server --no-pager -n 200 || true
